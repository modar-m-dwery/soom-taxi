# ---------------------------------------------------------------
# Nginx أمام daphne — سوم تاكسي
#
# ثلاث وظائف: خدمة الملفّات الساكنة من القرص، تمرير HTTP إلى daphne،
# وتمرير WebSocket بترقية الاتصال (Upgrade/Connection) — بدون السطرين
# الأخيرين يفشل كلّ /ws/ بصمت وتظنّ المشكلة في Channels.
# ---------------------------------------------------------------

upstream taxi_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # وثائق السائق ورخصته تُرفع كصور — مهلة أطول من الافتراضي
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------
    # الوسائط: داخلية فقط
    #
    # كانت هذه الكتلة `alias` مكشوفًا بلا أيّ فحص — أي أنّ صور الهويّات
    # ورخص القيادة ودفاتر المركبات لكلّ سائق كانت قابلة للتنزيل من
    # الإنترنت لمن يعرف المسار (والمسارات متوقّعة: اسم الملفّ يُحفظ كما
    # أرسله العميل). وكان `expires 7d` يدعو الوسطاء إلى تخزينها.
    #
    # الآن: `internal` تجعل هذا المسار غير قابل للطلب من الخارج إطلاقًا.
    # جانغو يفحص الملكية ثم يردّ بترويسة X-Accel-Redirect تشير إليه،
    # فيتولّى Nginx الإرسال. الفحص في بايثون والكفاءة في Nginx.
    # راجع drivers/views_media.py
    # ------------------------------------------------------------
    location /protected-media/ {
        internal;
        alias /var/www/media/;
    }

    # المسار العامّ القديم مُغلق صراحةً. تركه مفتوحًا "مؤقّتًا" هو كيف
    # تبقى هذه الثغرة سنة.
    location /media/ {
        return 404;
    }

    # WebSocket — يجب أن يسبق location / لأنه أكثر تحديدًا
    location /ws/ {
        proxy_pass http://taxi_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # اتصال الرحلة يبقى مفتوحًا طوال الرحلة — لا تقطعه بعد 60 ثانية
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://taxi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # USE_X_FORWARDED_PROTO=True في .env.production يعتمد على هذا
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

