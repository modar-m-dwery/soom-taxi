# ---------------------------------------------------------------
# الإنتاج — سوم تاكسي
#
#   docker compose -f compose.production.yaml --env-file .env.production up -d --build
#
# ما كان ناقصًا في النسخة السابقة من هذا الملفّ:
#   • لا منفذ منشور ولا Nginx → خدمة web غير قابلة للوصول من خارج الشبكة
#   • depends_on بلا condition → التطبيق يبدأ قبل جاهزية قاعدة البيانات
#   • لا خطوة migrate → قاعدة فارغة عند أول إقلاع
#   • env_file: .env أي ملفّ التطوير (DEBUG=True) في الإنتاج
#   • Redis مكشوف بلا كلمة مرور
#   • لا حدود موارد ولا سياسة إعادة تشغيل ولا تدوير سجلات
# ---------------------------------------------------------------

name: soum-taxi

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: soum-taxi-backend:${APP_VERSION:-latest}
  env_file: .env.production
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media_data:/app/media
    - app_logs:/app/logs
    - app_run:/app/run
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  postgres:
    image: postgis/postgis:16-3.5
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # سقف الاتصالات: الافتراضي 100، وهو ما نفد فعليًّا عند ثمانين مستخدمًا
    # متزامنًا قبل إضافة تجمّع الاتصالات. القاعدة:
    #   max_connections >= (عدد عمليّات التطبيق × DB_POOL_MAX) + احتياطي إداري
    # هنا: web + celery + beat = 3 × 20 = 60، ونترك هامشًا واسعًا.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # لا ports: قاعدة البيانات لا تُنشر على المضيف في الإنتاج
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: always
    # كلمة مرور إجبارية: ريديس هنا يحمل الجلسات والحضور وطابور Celery
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      LOG_STREAM: web
      SERVE_STATIC_FILES: "False"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - media_data:/app/media
      - app_logs:/app/logs
      - app_run:/app/run
      - static_data:/app/staticfiles
    expose:
      - "8000"

  celery:
    <<: *app
    environment:
      LOG_STREAM: celery
    command: celery -A config worker -l info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_healthy}

  beat:
    <<: *app
    environment:
      LOG_STREAM: beat
    command: >
      celery -A config beat -l info
      --schedule /app/run/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_healthy}

  # Nginx هو ما يواجه الإنترنت — ينهي TLS، يخدم /static/ و/media/ من
  # القرص مباشرة، ويمرّر HTTP وWebSocket إلى daphne.
  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./docker/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  # ---------------------- النسخ الاحتياطي ----------------------
  #
  # حلقة نوم بدل cron: صورة postgres لا تحوي cron، وإضافته يعني بناء
  # صورة ثانية لأجل سطر واحد. الحلقة تعمل، وتُرى في `docker logs`.
  #
  # الاستعادة تُختبر يدويًّا كلّ شهر — لا تكتفِ بنجاح النسخ:
  #   docker compose -f compose.production.yaml run --rm \
  #       backup /usr/local/bin/restore.sh /backups/<الملفّ>.dump
  backup:
    image: postgis/postgis:16-3.5
    restart: always
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/restore.sh:/usr/local/bin/restore.sh:ro
      - backups:/backups
    entrypoint:
      - /bin/bash
      - -c
      - |
        while true; do
          /usr/local/bin/backup.sh || echo "[backup] فشلت — ستُعاد المحاولة."
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  app_logs:
  app_run:
  backups:
