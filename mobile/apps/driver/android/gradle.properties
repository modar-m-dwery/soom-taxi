# ذاكرة البناء — مضبوطة لجهازٍ يشغّل أشياء أخرى معه.
#
# الخطأ الذي قاد إلى هذه القيم:
#     e: Failed connecting to the daemon in 4 retries
# وهو Kotlin يفشل في بدء آلة جافا ثانية. لا علاقة له بالشبكة رغم
# كلمة daemon: هو نفاد ذاكرة. البناء كان يجري والمحاكي يعمل (2.5 غ.ب)
# وخمس حاويات دوكر وGradle بأربعة غيغابايت — فلم يبقَ لـKotlin شيء.

# in-process: تُترجَم Kotlin داخل آلة Gradle نفسها بلا آلة ثانية.
# أبطأ قليلًا في البناءات المتتالية، لكنّه يعمل على ذاكرة محدودة —
# وبناءٌ أبطأ خيرٌ من بناءٍ لا يتمّ.
kotlin.compiler.execution.strategy=in-process

# ثلاثة غيغابايت لا أربعة: الترجمة صارت داخل هذه الآلة، فهي تحتاج
# متّسعًا، والنظام يحتاج ما يبقى.
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.internal.http.socketTimeout=300000 -Dorg.gradle.internal.http.connectionTimeout=300000 -Dhttp.socketTimeout=300000 -Dhttp.connectionTimeout=300000

# التوازي مطفأ: مهمّتان متزامنتان تعنيان ذروتَي ذاكرة متزامنتين.
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=true

# ---------------------------------------------------------------
# مهل الشبكة.
#
# قيست الوصلة بـ371 كيلوبايت/ث والمهلة الافتراضية ثلاثون ثانية، أي
# أنّ التنزيل يموت عند أحد عشر ميغابايت. لذلك كانت الملفّات الصغيرة
# تصل دائمًا والكبيرة لا تصل أبدًا — ورسالة Gradle حينها
# «Could not find …jar» وهي مضلّلة: الملفّ موجود ويردّ 200.
#
# وصيغة ‎-D أعلاه لا systemProp هي ما يصل إلى بناء فلاتر المُدخَل،
# لأنّه لا يقرأ هذا الملفّ لكنّه يعمل في آلة جافا نفسها.
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

org.gradle.internal.repository.max.tentatives=6
org.gradle.internal.repository.initial.backoff=2000
# ---------------------------------------------------------------

android.useAndroidX=true
android.enableJetifier=true

# R8 الكامل يحتاج ذاكرة أكبر، والتصغير غير ضروريّ لبناء تحقّق.
android.enableR8.fullMode=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
