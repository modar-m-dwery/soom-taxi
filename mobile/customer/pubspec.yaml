name: soum_customer
description: تطبيق زبون سوم تاكسي.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  soum_core: ^1.0.0
  soum_ui: ^1.0.0
  soum_maps: ^1.0.0
  soum_push: ^1.0.0
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.5
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  # لفتح الرابط العميق لتليغرام — البوت لا يستطيع بدء محادثة.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # لبناء جلسات مباشرة في الاختبارات الحيّة.
  dio: ^5.9.0

flutter:
  uses-material-design: true
