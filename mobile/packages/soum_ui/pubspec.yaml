name: soum_ui
description: >
  نظام تصميم سوم تاكسي — ثيم واتجاه وترجمة ومكوّنات مشتركة بين التطبيقين.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  soum_core: ^1.0.0
  intl: ^0.20.2
  flutter_riverpod: ^3.0.3
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # لمحوّل شبكة مزيّف يسجّل ترتيب النداءات في اختبار تسلسل الإقلاع.
  dio: ^5.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/logo.png

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
